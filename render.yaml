# Blueprint Render — environnement UAT OnePay (pas la prod)
# Postgres (une seule instance, schéma `keycloak` séparé) + Keycloak + payment-backend + pgAdmin
databases:
  - name: onepay-uat-db
    databaseName: onepay
    user: onepay
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: [] # accès réseau privé Render uniquement

services:
  - type: web
    name: onepay-keycloak-uat
    runtime: docker
    plan: free
    region: frankfurt
    branch: develop
    dockerfilePath: ./deploy/keycloak/Dockerfile
    dockerContext: ./deploy/keycloak
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8080"
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_PROXY
        value: edge
      - key: KC_DB_SCHEMA
        value: keycloak
      - key: KC_DB_URL_HOST
        fromDatabase: { name: onepay-uat-db, property: host }
      - key: KC_DB_URL_PORT
        fromDatabase: { name: onepay-uat-db, property: port }
      - key: KC_DB_URL_DATABASE
        fromDatabase: { name: onepay-uat-db, property: database }
      - key: KC_DB_USERNAME
        fromDatabase: { name: onepay-uat-db, property: user }
      - key: KC_DB_PASSWORD
        fromDatabase: { name: onepay-uat-db, property: password }
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        generateValue: true
      # Mot de passe commun des 7 comptes de test du realm (saisi à la création du blueprint)
      - key: UAT_USERS_PASSWORD
        sync: false
      # Secret du client confidentiel onepay-backend, partagé avec le backend
      - key: KC_BACKEND_CLIENT_SECRET
        generateValue: true

  - type: web
    name: onepay-backend-uat
    runtime: docker
    plan: free
    region: frankfurt
    branch: develop
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: uat
      - key: DB_HOST
        fromDatabase: { name: onepay-uat-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: onepay-uat-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: onepay-uat-db, property: database }
      - key: DB_USER
        fromDatabase: { name: onepay-uat-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: onepay-uat-db, property: password }
      # URL publique Keycloak, ex. https://onepay-keycloak-uat.onrender.com/realms/onepay
      - key: KEYCLOAK_ISSUER_URI
        sync: false
      # Ex. https://onepay-keycloak-uat.onrender.com (API d'administration Keycloak)
      - key: KEYCLOAK_SERVER_URL
        sync: false
      - key: KEYCLOAK_ADMIN_CLIENT_SECRET
        fromService: { type: web, name: onepay-keycloak-uat, envVarKey: KC_BACKEND_CLIENT_SECRET }
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # E-mail des identifiants à la création d'un compte : API HTTP Brevo (SMTP bloqué sur Render gratuit)
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      # Expéditeur vérifié dans Brevo (Senders & IP)
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: OnePay+
      # Lien de connexion indiqué dans l'e-mail (back-office)
      - key: MAIL_LOGIN_URL
        value: http://localhost:4200
      # Notifications push : passer PUSH_PROVIDER à firebase une fois FIREBASE_CREDENTIALS renseigné
      - key: PUSH_PROVIDER
        value: none
      - key: FIREBASE_CREDENTIALS
        sync: false

  - type: web
    name: onepay-pgadmin-uat
    runtime: docker
    plan: free
    region: frankfurt
    branch: develop
    dockerfilePath: ./deploy/pgadmin/Dockerfile
    dockerContext: ./deploy/pgadmin
    envVars:
      - key: PORT
        value: "8080"
      # Identifiant de connexion à pgAdmin (doit avoir un format d'e-mail)
      - key: PGADMIN_DEFAULT_EMAIL
        value: admin@onepay.sn
      - key: PGADMIN_DEFAULT_PASSWORD
        generateValue: true
      - key: DB_HOST
        fromDatabase: { name: onepay-uat-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: onepay-uat-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: onepay-uat-db, property: database }
      - key: DB_USER
        fromDatabase: { name: onepay-uat-db, property: user }
