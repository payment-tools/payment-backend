# Profil UAT (Render) — activé par SPRING_PROFILES_ACTIVE=uat
spring:
  datasource:
    # Render fournit l'hôte/port/base séparément (pas d'URL JDBC prête à l'emploi)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  liquibase:
    # Pas de jeu de données de démo en UAT : la base démarre vide
    contexts: uat

  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.type.descriptor.sql: info
