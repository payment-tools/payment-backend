spring:
  application:
    name: OnePay-Backend
  jackson:
    serialization:
      fail-on-empty-beans: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onepay}
    username: ${SPRING_DATASOURCE_USERNAME:onepay}
    password: ${SPRING_DATASOURCE_PASSWORD:onepay}

  liquibase:
    change-log: classpath:db.changelog-master.xml
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/onepay}

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    database: postgresql

logging:
  level:
    org.hibernate.type.descriptor.sql: trace

server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: OnePay Backend
    version: 0.0.1-SNAPSHOT

onepay:
  qrcode:
    client:
      ttl-seconds: ${QRCODE_CLIENT_TTL_SECONDS:300}
      purge-interval-ms: ${QRCODE_CLIENT_PURGE_INTERVAL_MS:300000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  keycloak:
    # API d'administration (comptes de connexion, premier mot de passe) via le compte de service onepay-backend
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:onepay}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:onepay-backend}
    # Valeur de dev uniquement (realm local) : à surcharger hors poste de développement
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:onepay-backend-dev-secret}
    login-client-id: ${KEYCLOAK_LOGIN_CLIENT_ID:onepay-mobile}
  mail:
    # none (défaut : aucun envoi, mot de passe à réinitialiser depuis Keycloak) | brevo (API HTTP)
    provider: ${MAIL_PROVIDER:none}
    from-email: ${MAIL_FROM_EMAIL:no-reply@onepay.sn}
    from-name: ${MAIL_FROM_NAME:OnePay+}
    # Lien de connexion indiqué dans l'e-mail
    login-url: ${MAIL_LOGIN_URL:http://localhost:4200}
    brevo:
      api-url: ${BREVO_API_URL:https://api.brevo.com}
      api-key: ${BREVO_API_KEY:}
