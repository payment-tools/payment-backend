version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: onepay-postgres
    environment:
      POSTGRES_DB: onepay
      POSTGRES_USER: onepay
      POSTGRES_PASSWORD: onepay
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onepay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onepay"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onepay-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onepay
      SPRING_DATASOURCE_USERNAME: onepay
      SPRING_DATASOURCE_PASSWORD: onepay
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onepay-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  onepay-network:
    driver: bridge